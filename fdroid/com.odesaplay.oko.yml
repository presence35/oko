MaintainerNotes: No scanignore or scandelete entries are needed — fdroidserver only
  flags .a/.aar/.class/.dex/.gz/.so/.zip/.jar/.wasm/.apk plus extensionless or executable
  binaries, so the bundled .webp/.png/.mp4 assets pass. Adding an unused scanignore
  path is itself a hard error, so do not add one speculatively. The buildserver ships
  almost no Android SDK (only `tools`), so the first build downloads platforms;android-36
  and build-tools 36.x for compileSdk 36. If that download fails it will be the first
  thing in the log; the NDK is likewise absent, which should only produce an "unable
  to strip" warning for MapLibre's .so files. The version here (0.6.828) and the matching
  fastlane/changelogs/<versionCode>.txt must be re-pinned to whatever release is actually
  tagged when this is submitted — the project releases often, so both drift.

